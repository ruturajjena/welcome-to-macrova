  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .logo {
      width: 76px; height: 76px;
      margin: 0 auto 22px;
      border-radius: 20px;
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    .sub { color: #cbd5e1; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
    .spinner {
      width: 34px; height: 34px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 15px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
    a.btn .store { font-size: 13px; color: #94a3b8; font-weight: 500; }
    a.btn .name { font-size: 17px; }
    a.btn svg { width: 24px; height: 24px; flex-shrink: 0; }
    .label { color: #94a3b8; font-size: 13px; margin-bottom: 14px; }
    .footer { margin-top: 28px; font-size: 13px; color: #64748b; }
    .footer a { color: #94a3b8; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo.png" alt="Macrova" />

    <!-- Shown while detecting/redirecting on mobile -->
    <div id="redirecting">
      <div class="spinner"></div>
      <h1>Opening your app store…</h1>
      <p class="sub">Taking you to Macrova. If nothing happens, tap your store below.</p>
    </div>

    <!-- Shown to desktop, or as fallback if redirect is blocked -->
    <div id="chooser" class="hidden">
      <h1>Download Macrova</h1>
      <p class="sub">AI Nutrition &amp; Macro Tracker. Choose your platform:</p>
    </div>

    <div class="btns">
      <p class="label" id="fallbackLabel">Or choose manually:</p>
      <a class="btn" id="iosBtn" href="https://apps.apple.com/in/app/macrova-ai-calorie-counter/id6778376235">
        <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.42 2.2-1.13 3.02-.84.97-2.2 1.72-3.34 1.63-.14-1.1.42-2.27 1.1-3.04.78-.88 2.13-1.55 3.37-1.61zM20.5 17.1c-.6 1.38-.88 2-1.65 3.22-1.07 1.7-2.58 3.82-4.45 3.84-1.66.02-2.09-1.08-4.35-1.07-2.26.01-2.73 1.09-4.39 1.07-1.87-.02-3.3-1.93-4.37-3.63-3-4.77-3.32-10.36-1.47-13.33 1.32-2.1 3.4-3.34 5.36-3.34 1.99 0 3.24 1.09 4.89 1.09 1.6 0 2.57-1.09 4.88-1.09 1.74 0 3.59.95 4.9 2.59-4.31 2.36-3.61 8.51.0 10.65z"/></svg>
        <span><span class="store">Download on the</span><br><span class="name">App Store</span></span>

        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.6 2.4 13 11.8l-2.6 2.6L3.6 2.4z" fill="#34d399"/><path d="M3.6 2.4l6.8 12L3.6 21.6c-.4-.2-.6-.6-.6-1.1V3.5c0-.5.2-.9.6-1.1z" fill="#34d399"/><path d="M16.4 8.9l2.9 1.7c.9.5.9 1.8 0 2.3l-2.9 1.7-3-2.9 3-2.8z" fill="#fbbf24"/><path d="M3.6 2.4c.3-.2.7-.2 1.1 0l11.7 6.5-3 2.9L3.6 2.4z" fill="#60a5fa"/><path d="M13.4 11.8l3 2.9L4.7 21.6c-.4.2-.8.2-1.1 0l9.8-9.8z" fill="#f87171"/></svg>
        <span><span class="store">GET IT ON</span><br><span class="name">Google Play</span></span>
      </a>
    </div>

    <p class="footer"><a href="/">← Back to macrova.in</a></p>
  </div>

  <script>
    (function () {
      var IOS_URL = "https://apps.apple.com/in/app/macrova-ai-calorie-counter/id6778376235";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.ruturajjena.junkfoodtracker";

      function detectOS() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";
        // Windows Phone UA also contains "Android" — check it first.
        if (/windows phone/i.test(ua)) return "other";
        if (/android/i.test(ua)) return "android";
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
        // iPadOS 13+ reports as "Macintosh"; distinguish by touch support.
        if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return "ios";
        return "other";
      }

      var os = detectOS();
      var redirecting = document.getElementById("redirecting");
      var chooser = document.getElementById("chooser");
      var fallbackLabel = document.getElementById("fallbackLabel");

      function showChooser() {
        redirecting.classList.add("hidden");
        chooser.classList.remove("hidden");
        fallbackLabel.classList.add("hidden");
      }

      if (os === "ios") {
        window.location.replace(IOS_URL);
      } else if (os === "android") {
        window.location.replace(ANDROID_URL);
      } else {
        // Desktop / unknown — don't auto-redirect, let the user choose.
        showChooser();
      }

      // Safety net: if the redirect was blocked (e.g. some in-app browsers),
      // reveal the manual buttons after a short delay.
      if (os === "ios" || os === "android") {
        setTimeout(function () {
          redirecting.querySelector("h1").textContent = "Tap to continue";
          redirecting.querySelector(".sub").textContent =
            "If the store didn't open automatically, tap your platform below.";
          fallbackLabel.classList.add("hidden");
        }, 2500);
      }
    })();
  </script>
